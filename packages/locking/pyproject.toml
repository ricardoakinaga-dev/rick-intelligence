[project]
name = "rick-locking"
version = "1.5.0"
description = "Owner-safe asynchronous leases and distributed Redis coordination"
requires-python = ">=3.12"
dependencies = ["rick-contracts", "httpx==0.27.0"]

[project.optional-dependencies]
redis = ["redis==5.2.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
