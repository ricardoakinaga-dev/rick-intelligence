name: Phase 1.1 Root Foundation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-1.1-root-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12.3"
  NODE_VERSION: "22.19.0"
  NODE_INSTALL_MODE: "npm ci --ignore-scripts --no-audit --no-fund"

jobs:
  root-foundation:
    name: root / Phase 1.1 foundation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup pinned Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.6.0
        with:
          python-version: "3.12.3"
          cache: pip
          cache-dependency-path: requirements/test.lock

      - name: Setup pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.19.0"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install pinned root test dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --require-hashes --only-binary=:all: -r requirements/test.lock
          python -m pip check

      - name: Install pinned TypeScript boundary parser
        working-directory: apps/web
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Restore versioned control inputs
        run: make control-inputs-restore

      - name: Run root Phase 1.1 CI contract
        run: make ci

      - name: Recheck control-plane pointers
        run: |
          args=(--require-clean --require-remote)
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_NAME}" == "main" ]]; then
            args+=(--require-main-sync)
          fi
          python docs/ci/check_control_plane.py "${args[@]}"
          git diff --check
