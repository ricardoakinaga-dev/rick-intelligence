name: phase-1.5-root-professor

on:
  push:
    paths:
      - "apps/api/**"
      - "packages/contracts/**"
      - "packages/providers/**"
      - "packages/locking/**"
      - "packages/professor/**"
      - "scripts/phase15/**"
      - "scripts/phase11/runner.py"
      - "Makefile"
      - ".github/workflows/phase-1.5.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "packages/contracts/**"
      - "packages/providers/**"
      - "packages/locking/**"
      - "packages/professor/**"
      - "scripts/phase15/**"
      - "scripts/phase11/runner.py"
      - "Makefile"

permissions:
  contents: read

concurrency:
  group: phase-1.5-root-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  root-professor:
    name: root / Professor vertical slice
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.6.0
        with:
          python-version: "3.12.3"
      - name: Install pinned root test dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --require-hashes --only-binary=:all: -r requirements/test.lock
          python -m pip check
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.19.0"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install pinned TypeScript boundary parser
        working-directory: apps/web
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Restore versioned control inputs
        run: make control-inputs-restore
      - name: Validate current root boundaries and protected children
        run: make validate
      - name: Run Phase 1.5 root contract/provider/lock/Professor/API suites
        run: make api15-full
      - name: Run Phase 1.4 regression suite
        run: make api14-full
      - name: Verify retired components stay retired
        run: python3 scripts/phase15/check_boundaries.py --retired-only
      - name: Verify patch whitespace
        run: git diff --check
