name: phase-1.5-root-professor

on:
  push:
    paths:
      - "apps/api/**"
      - "packages/contracts/**"
      - "packages/providers/**"
      - "packages/locking/**"
      - "packages/professor/**"
      - "scripts/phase15/**"
      - "scripts/phase11/runner.py"
      - "Makefile"
      - ".github/workflows/phase-1.5.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "packages/contracts/**"
      - "packages/providers/**"
      - "packages/locking/**"
      - "packages/professor/**"
      - "scripts/phase15/**"
      - "scripts/phase11/runner.py"
      - "Makefile"

permissions:
  contents: read

concurrency:
  group: phase-1.5-root-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  root-professor:
    name: root / Professor vertical slice
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12.3"
      - name: Install pinned root test dependencies
        run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          "fastapi==0.109.2" "uvicorn==0.27.1" "pydantic==2.6.1"
          "httpx==0.27.0" "pytest==8.0.2" "pytest-asyncio==0.23.5"
      - name: Validate current root boundaries and protected children
        run: make validate
      - name: Run Phase 1.5 root contract/provider/lock/Professor/API suites
        run: make api15-full
      - name: Run Phase 1.4 regression suite
        run: make api14-full
      - name: Verify no protected child changed
        run: test -z "$(git status --porcelain -- cvg-master-rag-v2 rick-professor modulo-redis-locker)"
      - name: Verify patch whitespace
        run: git diff --check
