name: State of Art / release integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Deny all token permissions by default.  The job grants only the read access
# required by actions/checkout to observe the candidate checkout.
permissions: {}

concurrency:
  group: state-of-art-release-integrity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-integrity:
    name: release / integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Run dependency-free gate tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s scripts/state_of_art/tests -p 'test_*.py' -v

      - name: Run explicit root release checks
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          git diff --check
          make validate
          python3 scripts/state_of_art/release_integrity.py \
            --require-clean \
            --evidence docs/progress/release-evidence.json
