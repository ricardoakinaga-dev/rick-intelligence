name: State of Art / release integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Deny all token permissions by default.  The job grants only the read access
# required by actions/checkout to observe the candidate checkout.
permissions: {}

concurrency:
  group: state-of-art-release-integrity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-integrity:
    name: release / integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    permissions:
      contents: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.6.0
        with:
          python-version: "3.12.3"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.19.0"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install pinned TypeScript boundary parser
        working-directory: apps/web
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Restore versioned control inputs
        run: make control-inputs-restore
      - name: Run pinned gate tests
        run: |
          python3 -m pip install --disable-pip-version-check --no-cache-dir --require-hashes --only-binary=:all: -r requirements/test.lock
          python3 -m pip check
          python3 -m pytest -q -p no:cacheprovider scripts/state_of_art/tests

      - name: Generate commit-bound release evidence
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 scripts/state_of_art/generate_release_evidence.py --environment ci --output .runtime/release/release-evidence.json

      - name: Run explicit root release checks
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          git diff --check
          make validate
          python3 scripts/state_of_art/release_integrity.py \
            --require-clean \
            --evidence .runtime/release/release-evidence.json
