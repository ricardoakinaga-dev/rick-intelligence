name: phase-1.6-root-ingestion

on:
  push:
    paths:
      - "apps/api/**"
      - "apps/worker/**"
      - "packages/contracts/**"
      - "packages/knowledge/**"
      - "packages/ingestion/**"
      - "packages/retrieval/**"
      - "packages/providers/**"
      - "packages/locking/**"
      - "packages/professor/**"
      - "scripts/phase15/**"
      - "scripts/phase16/**"
      - "scripts/state_of_art/summarize_coverage.py"
      - "scripts/state_of_art/tests/test_summarize_coverage.py"
      - "requirements/runtime.lock"
      - "requirements/test.lock"
      - "Makefile"
      - ".env.example"
      - "docs/architecture/ingestion-lifecycle.md"
      - ".github/workflows/phase-1.6.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/worker/**"
      - "packages/contracts/**"
      - "packages/knowledge/**"
      - "packages/ingestion/**"
      - "packages/retrieval/**"
      - "packages/providers/**"
      - "packages/locking/**"
      - "packages/professor/**"
      - "scripts/phase15/**"
      - "scripts/phase16/**"
      - "scripts/state_of_art/summarize_coverage.py"
      - "scripts/state_of_art/tests/test_summarize_coverage.py"
      - "requirements/runtime.lock"
      - "requirements/test.lock"
      - "Makefile"
      - ".env.example"
      - "docs/architecture/ingestion-lifecycle.md"
      - ".github/workflows/phase-1.6.yml"

permissions:
  contents: read

concurrency:
  group: phase-1.6-root-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  root-ingestion:
    name: root / bounded ingestion lifecycle
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.6.0
        with:
          python-version: "3.12.3"
      - name: Install pinned root test dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --require-hashes --only-binary=:all: -r requirements/test.lock
          python -m pip check
      - name: Restore versioned control inputs
        run: make control-inputs-restore
      - name: Run Phase 1.6 focused and regression evidence matrix
        run: make api16-verify
      - name: Verify retired components stay retired
        run: python3 scripts/phase15/check_boundaries.py --retired-only
      - name: Verify patch whitespace
        run: git diff --check
