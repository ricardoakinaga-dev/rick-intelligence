name: phase-1.6-root-ingestion

on:
  push:
    paths:
      - "apps/api/**"
      - "apps/worker/**"
      - "packages/contracts/**"
      - "packages/knowledge/**"
      - "packages/ingestion/**"
      - "packages/retrieval/**"
      - "packages/providers/**"
      - "packages/locking/**"
      - "packages/professor/**"
      - "scripts/phase15/**"
      - "scripts/phase16/**"
      - "Makefile"
      - ".env.example"
      - "docs/architecture/ingestion-lifecycle.md"
      - ".github/workflows/phase-1.6.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/worker/**"
      - "packages/contracts/**"
      - "packages/knowledge/**"
      - "packages/ingestion/**"
      - "packages/retrieval/**"
      - "packages/providers/**"
      - "packages/locking/**"
      - "packages/professor/**"
      - "scripts/phase15/**"
      - "scripts/phase16/**"
      - "Makefile"
      - ".env.example"
      - "docs/architecture/ingestion-lifecycle.md"
      - ".github/workflows/phase-1.6.yml"

permissions:
  contents: read

concurrency:
  group: phase-1.6-root-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  root-ingestion:
    name: root / bounded ingestion lifecycle
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12.3"
      - name: Install pinned root test dependencies
        run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          "fastapi==0.109.2" "uvicorn==0.27.1" "pydantic==2.6.1"
          "httpx==0.27.0" "python-multipart==0.0.9"
          "pytest==8.0.2" "pytest-asyncio==0.23.5"
      - name: Run Phase 1.6 focused and regression evidence matrix
        run: make api16-verify
      - name: Verify no protected child changed
        run: test -z "$(git status --porcelain -- cvg-master-rag-v2 rick-professor modulo-redis-locker)"
      - name: Verify patch whitespace
        run: git diff --check
