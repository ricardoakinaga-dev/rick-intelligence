name: phase-1.4-rag-extraction

on:
  push:
    paths:
      - "packages/knowledge/**"
      - "packages/ingestion/**"
      - "packages/retrieval/**"
      - "packages/contracts/**"
      - "apps/api/**"
      - "scripts/phase13/phase14.py"
      - ".github/workflows/phase-1.4.yml"
  pull_request:
    paths:
      - "packages/knowledge/**"
      - "packages/ingestion/**"
      - "packages/retrieval/**"
      - "packages/contracts/**"
      - "apps/api/**"

jobs:
  rag-extraction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --require-hashes --only-binary=:all: -r requirements/phase13.lock
          python -m pip check
      - name: Package unit suites
        run: python scripts/phase13/phase14.py units
      - name: Differential + shadow + E2E
        run: python scripts/phase13/phase14.py differential
      - name: ACL negatives
        run: python scripts/phase13/phase14.py acl
      - name: Full apps/api matrix
        run: python scripts/phase13/phase14.py api
      - name: Legacy focused regression
        run: python scripts/phase13/phase14.py legacy
      - name: Performance budget
        run: python scripts/phase13/phase14.py benchmark
