name: phase-1.4-rag-extraction

on:
  push:
    paths:
      - "packages/knowledge/**"
      - "packages/ingestion/**"
      - "packages/retrieval/**"
      - "packages/contracts/**"
      - "apps/api/**"
      - "scripts/phase13/phase14.py"
      - ".github/workflows/phase-1.4.yml"
  pull_request:
    paths:
      - "packages/knowledge/**"
      - "packages/ingestion/**"
      - "packages/retrieval/**"
      - "packages/contracts/**"
      - "apps/api/**"

jobs:
  rag-extraction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: python -m pip install "fastapi==0.109.2" "uvicorn==0.27.1" "pydantic==2.6.1" "httpx==0.27.0" "pytest==8.0.2" "python-multipart==0.0.9" "qdrant-client==1.7.3" "python-dotenv==1.0.1" "uuid6==2024.1.12" "pytest-asyncio==0.23.5"
      - name: Package unit suites
        run: python scripts/phase13/phase14.py units
      - name: Differential + shadow + E2E
        run: python scripts/phase13/phase14.py differential
      - name: ACL negatives
        run: python scripts/phase13/phase14.py acl
      - name: Full apps/api matrix
        run: python scripts/phase13/phase14.py api
      - name: Legacy focused regression
        run: python scripts/phase13/phase14.py legacy
      - name: Performance budget
        run: python scripts/phase13/phase14.py benchmark
