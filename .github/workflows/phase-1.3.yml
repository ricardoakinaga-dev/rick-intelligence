name: phase-1.3-api-kernel

on:
  push:
    paths:
      - "apps/api/**"
      - "packages/contracts/**"
      - "scripts/phase13/**"
      - ".github/workflows/phase-1.3.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "packages/contracts/**"
      - "scripts/phase13/**"

jobs:
  api-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install API deps
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --require-hashes --only-binary=:all: -r requirements/phase13.lock
          python -m pip check
      - name: API unit tests
        run: make api-test
      - name: API security negatives + policy
        run: make api-security
      - name: OpenAPI schema check
        run: make api-contract
      - name: Kernel overhead observation
        run: make api-benchmark
