name: phase-1.3-api-kernel

on:
  push:
    paths:
      - "apps/api/**"
      - "packages/contracts/**"
      - "scripts/phase13/**"
      - ".github/workflows/phase-1.3.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "packages/contracts/**"
      - "scripts/phase13/**"

jobs:
  api-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API deps
        run: python -m pip install "fastapi==0.109.2" "uvicorn==0.27.1" "pydantic==2.6.1" "httpx==0.27.0" "pytest==8.0.2" "python-multipart==0.0.9"
      - name: API unit tests
        run: make api-test
      - name: API security negatives + policy
        run: make api-security
      - name: OpenAPI schema check
        run: make api-contract
      - name: Kernel overhead observation
        run: make api-benchmark
