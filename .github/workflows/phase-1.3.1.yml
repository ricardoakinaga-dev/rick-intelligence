name: phase-1.3.1-identity-canonicalization

on:
  push:
    paths:
      - "packages/identity/**"
      - "packages/authorization/**"
      - "packages/contracts/**"
      - "apps/api/**"
      - "scripts/phase13/phase131.py"
      - ".github/workflows/phase-1.3.1.yml"
  pull_request:
    paths:
      - "packages/identity/**"
      - "packages/authorization/**"
      - "packages/contracts/**"
      - "apps/api/**"

jobs:
  canonical-identity-auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: python -m pip install "fastapi==0.109.2" "uvicorn==0.27.1" "pydantic==2.6.1" "httpx==0.27.0" "pytest==8.0.2" "python-multipart==0.0.9" "qdrant-client==1.7.3" "python-dotenv==1.0.1" "uuid6==2024.1.12" "pytest-asyncio==0.23.5"
      - name: Canonical package tests
        run: python scripts/phase13/phase131.py canonical
      - name: Differential + source-of-truth + negatives
        run: python scripts/phase13/phase131.py differential
      - name: Full apps/api matrix (Phase 1.3 regression)
        run: python scripts/phase13/phase131.py api
      - name: Legacy CVG auth regression
        run: python scripts/phase13/phase131.py legacy-auth
