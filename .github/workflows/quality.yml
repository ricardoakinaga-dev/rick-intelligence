name: RICK canonical quality lanes

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: rick-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12.3"
  NODE_VERSION: "22.19.0"
  PYTHONPATH: >-
    apps/api/src:apps/worker:packages/contracts/src:packages/jobs/src:
    packages/authorization/src:packages/identity/src:packages/observability/src:
    packages/knowledge/src:packages/ingestion/src:packages/retrieval/src:
    packages/providers/src:packages/locking/src:packages/professor/src:
    packages/evidence/src:packages/decision/src:packages/storage/src

jobs:
  fast:
    name: FAST / control and static
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install bounded test dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir "pytest==8.0.2" "pytest-asyncio==0.23.5" "pydantic==2.6.1" "httpx==0.27.0" "fastapi==0.109.2" "python-multipart==0.0.9" "psycopg[binary]==3.2.3" "redis==5.2.1"
      - name: Validate repository controls
        run: make validate
      - name: Validate migration/image static contracts
        run: make ops-static
      - name: Validate Compose topology without starting containers
        run: make compose-static
      - name: Validate whitespace and preserved child repositories
        run: |
          git diff --check
          test -z "$(git status --porcelain -- cvg-master-rag-v2 rick-professor modulo-redis-locker)"

  unit:
    name: UNIT / root packages
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install pinned root dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir "pytest==8.0.2" "pytest-asyncio==0.23.5" "pydantic==2.6.1" "httpx==0.27.0" "fastapi==0.109.2" "python-multipart==0.0.9" "psycopg[binary]==3.2.3" "redis==5.2.1"
      - name: Run root unit and contract suites
        run: |
          make api15-contracts
          make api15-provider
          make api15-lock
          make api15-professor
          make api16-domain
          make api16-worker
          python -m pytest -q -p no:cacheprovider packages/evidence/tests packages/decision/tests

  contract:
    name: CONTRACT / API and OpenAPI
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install API test dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir "pytest==8.0.2" "pytest-asyncio==0.23.5" "pydantic==2.6.1" "httpx==0.27.0" "fastapi==0.109.2" "python-multipart==0.0.9"
      - name: Run API contract and security lanes
        run: |
          make api-contract
          make api-security
          make api16-root

  rag-eval:
    name: RAG-EVAL / deterministic and ACL
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install evaluation dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir "pytest==8.0.2" "pydantic==2.6.1" "httpx==0.27.0"
      - name: Run local retrieval evaluation pack
        run: |
          make eval-retrieval
          make eval-retrieval-pack
          make api14-acl
          make security-adversarial

  frontend:
    name: E2E / frontend build surface
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install canonical web dependencies
        working-directory: apps/web
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run frontend lint, typecheck and build
        run: |
          make web-lint
          make web-typecheck
          make web-build
      - name: Record browser gate boundary
        run: echo "Browser E2E at 375/768/1440 is a separate runtime lane; no skip is converted to PASS here."

  supply-chain:
    name: SUPPLY-CHAIN / dependency and secret policy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install pinned scanner
        run: python -m pip install --disable-pip-version-check --no-cache-dir "pip-audit==2.9.0"
      - name: Audit preserved Python lock input
        run: pip-audit -r cvg-master-rag-v2/src/requirements.txt --strict
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Audit preserved Node lockfiles
        run: |
          for component in rick-professor modulo-redis-locker cvg-master-rag-v2/frontend apps/web; do
            npm --prefix "$component" ci --ignore-scripts --no-audit --no-fund
            npm --prefix "$component" audit --audit-level=high
          done

  release:
    name: RELEASE / commit-bound promotion gate
    needs: [fast, unit, contract, rag-eval, frontend, supply-chain]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Generate truthful release evidence
        run: make release-evidence
      - name: Reject incomplete or stale promotion evidence
        run: python scripts/state_of_art/release_integrity.py --require-clean --evidence docs/progress/release-evidence.json

  runtime:
    name: RUNTIME / disposable State-of-Art packet
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install real runtime clients
        run: python -m pip install --disable-pip-version-check --no-cache-dir "pytest==8.0.2" "pydantic==2.6.1" "httpx==0.27.0" "psycopg[binary]==3.2.3" "redis==5.2.1"
      - name: Run the integrated fail-closed verification packet
        run: make triple-aaa-verify
