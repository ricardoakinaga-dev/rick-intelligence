name: RICK canonical quality lanes

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions: {}

concurrency:
  group: rick-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12.3"
  NODE_VERSION: "22.19.0"
  PYTHONPATH: >-
    apps/api/src:apps/worker:packages/contracts/src:packages/jobs/src:
    packages/authorization/src:packages/identity/src:packages/observability/src:
    packages/knowledge/src:packages/ingestion/src:packages/retrieval/src:
    packages/providers/src:packages/locking/src:packages/professor/src:
    packages/evidence/src:packages/decision/src:packages/storage/src

jobs:
  fast:
    name: FAST / control and static
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install bounded test dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir "pytest==8.0.2" "pytest-asyncio==0.23.5" "pydantic==2.6.1" "httpx==0.27.0" "fastapi==0.109.2" "python-multipart==0.0.9" "psycopg[binary]==3.2.3" "redis==5.2.1"
      - name: Execute and record architecture CI gate
        run: |
          python3 scripts/state_of_art/ci_lane_evidence.py \
            --lane fast \
            --gate architecture \
            --output .runtime/ci/architecture.json \
            --log-output .runtime/ci/architecture.log \
            --command "make validate" \
            --command "make ops-static" \
            --command "make compose-static" \
            --command "python3 -c \"import subprocess,sys; sys.exit(1 if subprocess.check_output(['git','status','--porcelain','--','cvg-master-rag-v2','rick-professor','modulo-redis-locker']).strip() else 0)\"" \
            --command "git diff --check"
      - name: Upload architecture CI envelope
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ci-architecture-${{ github.run_id }}
          path: .runtime/ci
          if-no-files-found: warn
          include-hidden-files: true

  unit:
    name: UNIT / root packages
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install pinned root dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir "pytest==8.0.2" "pytest-asyncio==0.23.5" "pydantic==2.6.1" "httpx==0.27.0" "fastapi==0.109.2" "python-multipart==0.0.9" "psycopg[binary]==3.2.3" "redis==5.2.1"
      - name: Execute and record unit CI gate
        run: |
          python3 scripts/state_of_art/ci_lane_evidence.py \
            --lane unit \
            --gate unit \
            --output .runtime/ci/unit.json \
            --log-output .runtime/ci/unit.log \
            --command "make api15-contracts" \
            --command "make api15-provider" \
            --command "make api15-lock" \
            --command "make api15-professor" \
            --command "make api16-domain" \
            --command "make api16-worker" \
            --command "python -m pytest -q -p no:cacheprovider packages/evidence/tests packages/decision/tests"
      - name: Upload unit CI envelope
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ci-unit-${{ github.run_id }}
          path: .runtime/ci
          if-no-files-found: warn
          include-hidden-files: true

  contract:
    name: CONTRACT / API and OpenAPI
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install API test dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir "pytest==8.0.2" "pytest-asyncio==0.23.5" "pydantic==2.6.1" "httpx==0.27.0" "fastapi==0.109.2" "python-multipart==0.0.9"
      - name: Execute and record contracts CI gate
        run: |
          python3 scripts/state_of_art/ci_lane_evidence.py \
            --lane contract \
            --gate contracts \
            --output .runtime/ci/contracts.json \
            --log-output .runtime/ci/contracts.log \
            --command "make api-contract" \
            --command "make api16-root"
      - name: Upload contracts CI envelope
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ci-contracts-${{ github.run_id }}
          path: .runtime/ci
          if-no-files-found: warn
          include-hidden-files: true

  security:
    name: SECURITY / adversarial and route policy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install pinned security-test dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir "pytest==8.0.2" "pytest-asyncio==0.23.5" "pydantic==2.6.1" "httpx==0.27.0" "fastapi==0.109.2" "python-multipart==0.0.9"
      - name: Execute and record security CI gate
        run: |
          python3 scripts/state_of_art/ci_lane_evidence.py \
            --lane security \
            --gate security \
            --output .runtime/ci/security.json \
            --log-output .runtime/ci/security.log \
            --command "make api-security" \
            --command "make security-adversarial"
      - name: Upload security CI envelope
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ci-security-${{ github.run_id }}
          path: .runtime/ci
          if-no-files-found: warn
          include-hidden-files: true

  rag-eval:
    name: RAG-EVAL / deterministic and ACL
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install evaluation dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir "pytest==8.0.2" "pydantic==2.6.1" "httpx==0.27.0"
      - name: Run local retrieval evaluation pack
        run: |
          make eval-retrieval
          make eval-retrieval-pack
          make api14-acl
          make security-adversarial

  frontend:
    name: FRONTEND / build surface
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install canonical web dependencies
        working-directory: apps/web
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run frontend lint, typecheck and build
        run: |
          make web-lint
          make web-typecheck
          make web-build
      - name: Record browser gate boundary
        run: echo "Browser E2E at 375/768/1440 is a separate runtime lane; no skip is converted to PASS here."

  phase3-evidence:
    name: PHASE3 / capability evidence matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install matrix verification dependency
        run: python -m pip install --disable-pip-version-check --no-cache-dir "pytest==8.0.2"
      - name: Generate the current fail-closed capability matrix
        run: make phase3-evidence
      - name: Validate matrix binding and status semantics
        run: python3 scripts/state_of_art/generate_phase3_evidence.py --verify
      - name: Upload raw Phase 3 matrix
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: phase3-capability-matrix-${{ github.run_id }}
          path: .runtime/phase-3
          if-no-files-found: error
          include-hidden-files: true

  supply-chain:
    name: SUPPLY-CHAIN / dependency and secret policy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install pinned scanner
        run: python -m pip install --disable-pip-version-check --no-cache-dir "pip-audit==2.9.0"
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Execute and record supply-chain CI gate
        run: |
          python3 scripts/state_of_art/ci_lane_evidence.py \
            --lane supply-chain \
            --gate supply-chain \
            --output .runtime/ci/supply-chain.json \
            --log-output .runtime/ci/supply-chain.log \
            --command "pip-audit -r cvg-master-rag-v2/src/requirements.txt --strict" \
            --command "pip-audit -r scripts/state_of_art/requirements.txt --strict" \
            --command "npm --prefix rick-professor ci --ignore-scripts --no-audit --no-fund" \
            --command "npm --prefix rick-professor audit --audit-level=high" \
            --command "npm --prefix modulo-redis-locker ci --ignore-scripts --no-audit --no-fund" \
            --command "npm --prefix modulo-redis-locker audit --audit-level=high" \
            --command "npm --prefix cvg-master-rag-v2/frontend ci --ignore-scripts --no-audit --no-fund" \
            --command "npm --prefix cvg-master-rag-v2/frontend audit --audit-level=high" \
            --command "npm --prefix apps/web ci --ignore-scripts --no-audit --no-fund" \
            --command "npm --prefix apps/web audit --audit-level=high" \
            --command "python infrastructure/docker/check_release.py --mode prepared"
      - name: Upload supply-chain CI envelope
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ci-supply-chain-${{ github.run_id }}
          path: .runtime/ci
          if-no-files-found: warn
          include-hidden-files: true

  release:
    name: RELEASE / commit-bound promotion gate
    needs: [fast, unit, contract, security, rag-eval, frontend, supply-chain, phase3-evidence, runtime, frontend-runtime, performance, chaos, soak, nightly]
    if: >-
      always() &&
      needs.fast.result == 'success' &&
      needs.unit.result == 'success' &&
      needs.contract.result == 'success' &&
      needs.security.result == 'success' &&
      needs.rag-eval.result == 'success' &&
      needs.frontend.result == 'success' &&
      needs.supply-chain.result == 'success' &&
      needs.phase3-evidence.result == 'success' &&
      (needs.runtime.result == 'success' || (github.event_name != 'workflow_dispatch' && github.event_name != 'schedule')) &&
      (needs.frontend-runtime.result == 'success' || (github.event_name != 'workflow_dispatch' && github.event_name != 'schedule')) &&
      (needs.performance.result == 'success' || (github.event_name != 'workflow_dispatch' && github.event_name != 'schedule')) &&
      (needs.chaos.result == 'success' || (github.event_name != 'workflow_dispatch' && github.event_name != 'schedule')) &&
      (needs.soak.result == 'success' || (github.event_name != 'workflow_dispatch' && github.event_name != 'schedule')) &&
      (needs.nightly.result == 'success' || github.event_name != 'schedule')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Refuse promotion without a live-runtime event
        if: github.event_name != 'workflow_dispatch' && github.event_name != 'schedule'
        run: |
          echo "::error::Release promotion requires a current runtime/browser/operational evidence event; this push or pull request did not execute those lanes."
          exit 2
      - name: Download architecture CI envelope from this workflow run
        if: needs.fast.result == 'success'
        uses: actions/download-artifact@v4.3.0
        with:
          name: ci-architecture-${{ github.run_id }}
          path: .runtime/ci
      - name: Download unit CI envelope from this workflow run
        if: needs.unit.result == 'success'
        uses: actions/download-artifact@v4.3.0
        with:
          name: ci-unit-${{ github.run_id }}
          path: .runtime/ci
      - name: Download contracts CI envelope from this workflow run
        if: needs.contract.result == 'success'
        uses: actions/download-artifact@v4.3.0
        with:
          name: ci-contracts-${{ github.run_id }}
          path: .runtime/ci
      - name: Download security CI envelope from this workflow run
        if: needs.security.result == 'success'
        uses: actions/download-artifact@v4.3.0
        with:
          name: ci-security-${{ github.run_id }}
          path: .runtime/ci
      - name: Download supply-chain CI envelope from this workflow run
        if: needs.supply-chain.result == 'success'
        uses: actions/download-artifact@v4.3.0
        with:
          name: ci-supply-chain-${{ github.run_id }}
          path: .runtime/ci
      - name: Download runtime packet from this workflow run
        if: needs.runtime.result == 'success'
        uses: actions/download-artifact@v4.3.0
        with:
          name: phase3-runtime-${{ github.run_id }}
          path: .runtime/phase-3
      - name: Download frontend runtime diagnostics from this workflow run
        if: needs.frontend-runtime.result == 'success'
        uses: actions/download-artifact@v4.3.0
        with:
          name: phase3-frontend-runtime-${{ github.run_id }}
          path: .runtime/phase-3
      - name: Download performance diagnostics from this workflow run
        if: needs.performance.result == 'success'
        uses: actions/download-artifact@v4.3.0
        with:
          name: phase3-performance-${{ github.run_id }}
          path: .runtime/phase-3
      - name: Download chaos diagnostics from this workflow run
        if: needs.chaos.result == 'success'
        uses: actions/download-artifact@v4.3.0
        with:
          name: phase3-chaos-${{ github.run_id }}
          path: .runtime/phase-3
      - name: Download soak diagnostics from this workflow run
        if: needs.soak.result == 'success'
        uses: actions/download-artifact@v4.3.0
        with:
          name: phase3-soak-${{ github.run_id }}
          path: .runtime/phase-3
      - name: Download the exact Phase 3 matrix from this workflow run
        if: needs.phase3-evidence.result == 'success'
        uses: actions/download-artifact@v4.3.0
        with:
          name: phase3-capability-matrix-${{ github.run_id }}
          path: .runtime/phase-3
      - name: Require the downloaded matrix to be promotable
        run: python3 scripts/state_of_art/generate_phase3_evidence.py --verify --require-promotable
      - name: Generate truthful release evidence
        run: make release-evidence
      - name: Reject incomplete or stale promotion evidence
        run: python scripts/state_of_art/release_integrity.py --require-clean --evidence docs/progress/release-evidence.json

  runtime:
    name: RUNTIME / disposable State-of-Art packet
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install real runtime clients
        run: python -m pip install --disable-pip-version-check --no-cache-dir "pytest==8.0.2" "pydantic==2.6.1" "httpx==0.27.0" "psycopg[binary]==3.2.3" "redis==5.2.1" -r scripts/state_of_art/requirements.txt
      - name: Run the integrated fail-closed verification packet
        run: make triple-aaa-verify
      - name: Upload runtime packet and diagnostics
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: phase3-runtime-${{ github.run_id }}
          path: .runtime/phase-3
          if-no-files-found: warn
          include-hidden-files: true

  frontend-runtime:
    name: FRONTEND-RUNTIME / 375-768-1440 browser matrix
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install canonical web dependencies
        working-directory: apps/web
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Execute real browser runtime matrix
        run: make phase3-frontend-supply-runtime
      - name: Upload frontend runtime envelope and diagnostics
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: phase3-frontend-runtime-${{ github.run_id }}
          path: |
            .runtime/phase-3
            .gauntlet-state-of-art/evidence/visual-cycle5-current
            apps/web/test-results
            apps/web/playwright-report
            artifacts/visual/state-of-art
          if-no-files-found: warn
          include-hidden-files: true

  performance:
    name: PERFORMANCE / explicit fail-closed lane
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - name: Run the performance gate
        run: make phase3-performance
      - name: Upload performance envelope and diagnostics
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: phase3-performance-${{ github.run_id }}
          path: .runtime/phase-3
          if-no-files-found: warn
          include-hidden-files: true

  chaos:
    name: CHAOS / explicit fail-closed lane
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - name: Run the chaos gate
        run: make phase3-chaos
      - name: Upload chaos envelope and diagnostics
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: phase3-chaos-${{ github.run_id }}
          path: .runtime/phase-3
          if-no-files-found: warn
          include-hidden-files: true

  soak:
    name: SOAK / explicit fail-closed lane
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - name: Run the soak gate
        run: make phase3-soak
      - name: Upload soak envelope and diagnostics
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: phase3-soak-${{ github.run_id }}
          path: .runtime/phase-3
          if-no-files-found: warn
          include-hidden-files: true

  nightly:
    name: NIGHTLY / strict Phase 3 promotion boundary
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Generate and require a promotable Phase 3 matrix
        run: |
          make phase3-evidence
          make phase3-evidence-verify
      - name: Upload strict-nightly diagnostic
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: phase3-nightly-${{ github.run_id }}
          path: .runtime/phase-3
          if-no-files-found: warn
