# Production-like staging topology. Credentials, images, composition modules
# and endpoints are mandatory inputs; no value here is a production secret.
x-service-hardening: &service-hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  init: true
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m

# Stateful images retain write access only to their declared data volumes, but
# still run without privilege escalation or ambient Linux capabilities.
x-stateful-hardening: &stateful-hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  init: true

# Every service gets a finite staging budget.  These limits are configuration
# guardrails, not runtime performance evidence; promotion still requires an
# observed packet from the approved lab.
x-service-resources: &service-resources
  resources:
    limits:
      cpus: "1.00"
      memory: 1G

services:
  postgres:
    <<: *stateful-hardening
    image: postgres:16.4-alpine
    deploy: *service-resources
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?inject through staging secret configuration}
      POSTGRES_USER: ${POSTGRES_USER:?inject through staging secret configuration}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?inject through staging secret configuration}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [private]

  migrate:
    <<: *service-hardening
    image: ${RICK_API_IMAGE:?inject the exact immutable API image digest}
    deploy: *service-resources
    environment:
      RICK_EXTERNAL_DATABASE_DSN: ${RICK_EXTERNAL_DATABASE_DSN:?inject through the secret manager}
    command: ["python", "/opt/rick/infrastructure/scripts/migrate.py", "/opt/rick/infrastructure/migrations", "--apply"]
    depends_on:
      postgres: {condition: service_healthy}
    networks: [private]

  redis:
    <<: *stateful-hardening
    image: redis:7.4-alpine
    deploy: *service-resources
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?inject through staging secret configuration}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [private]

  qdrant:
    <<: *stateful-hardening
    image: qdrant/qdrant:v1.12.5
    deploy: *service-resources
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?inject through staging secret configuration}
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test:
        - CMD-SHELL
        - 'wget --header="api-key: $$QDRANT__SERVICE__API_KEY" -q -O- http://127.0.0.1:6333/healthz >/dev/null'
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [private]

  qdrant-init:
    <<: *service-hardening
    image: ${RICK_API_IMAGE:?inject the exact immutable API image digest}
    deploy: *service-resources
    environment:
      RICK_QDRANT_URL: ${RICK_QDRANT_URL:?inject through service config}
      RICK_QDRANT_API_KEY: ${QDRANT_API_KEY:?inject through the secret manager}
      RICK_QDRANT_COLLECTION: ${RICK_QDRANT_COLLECTION:?inject the versioned Qdrant collection}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1536}
    command: ["python", "/opt/rick/infrastructure/compose/bootstrap_qdrant.py"]
    depends_on:
      qdrant: {condition: service_healthy}
    networks: [private]

  object-store:
    <<: *stateful-hardening
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    deploy: *service-resources
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?inject through staging secret configuration}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?inject through staging secret configuration}
    volumes:
      - object-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - mc alias set local http://127.0.0.1:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1 && mc ready local
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [private]

  object-store-init:
    <<: *service-hardening
    image: minio/mc:RELEASE.2025-02-28T09-55-16Z
    deploy: *service-resources
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?inject through staging secret configuration}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?inject through staging secret configuration}
      RICK_OBJECT_STORE_BUCKET: ${RICK_OBJECT_STORE_BUCKET:?inject the object-store bucket}
      OBJECT_STORE_ACCESS_KEY_ID: ${OBJECT_STORE_ACCESS_KEY_ID:?inject through the secret manager}
      OBJECT_STORE_SECRET_ACCESS_KEY: ${OBJECT_STORE_SECRET_ACCESS_KEY:?inject through the secret manager}
    volumes:
      - ./infrastructure/compose/bootstrap_object_store.sh:/opt/bootstrap/bootstrap_object_store.sh:ro
    entrypoint: ["/bin/sh", "/opt/bootstrap/bootstrap_object_store.sh"]
    depends_on:
      object-store: {condition: service_healthy}
    networks: [private]

  jaeger:
    <<: *service-hardening
    image: jaegertracing/all-in-one:1.68.0
    deploy: *service-resources
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      SPAN_STORAGE_TYPE: memory
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:14269/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [private]

  otel-collector:
    <<: *service-hardening
    image: otel/opentelemetry-collector-contrib:0.123.0
    deploy: *service-resources
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./infrastructure/compose/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      jaeger: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:13133/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [private]

  metrics:
    <<: *service-hardening
    image: prom/prometheus:v2.55.1
    deploy: *service-resources
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --rule.file=/etc/prometheus/alerts.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - ./infrastructure/compose/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/compose/alerts.yml:/etc/prometheus/alerts.yml:ro
      - metrics-data:/prometheus
    depends_on:
      otel-collector: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:9090/-/ready >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [private]

  api:
    <<: *service-hardening
    image: ${RICK_API_IMAGE:?inject the exact immutable API image digest}
    deploy: *service-resources
    environment:
      RICK_ENV: production
      RICK_IDENTITY_MODE: production
      RICK_API_CHAT_BACKEND: professor
      RICK_API_COMPOSITION: ${RICK_API_COMPOSITION:?inject the reviewed module:factory composition}
      RICK_EXTERNAL_DATABASE_DSN: ${RICK_EXTERNAL_DATABASE_DSN:?inject through the secret manager}
      RICK_REDIS_URL: ${RICK_REDIS_URL:?inject the managed Redis URL}
      RICK_QDRANT_URL: ${RICK_QDRANT_URL:?inject the managed Qdrant URL}
      RICK_QDRANT_COLLECTION: ${RICK_QDRANT_COLLECTION:?inject the versioned Qdrant collection}
      RICK_QDRANT_API_KEY: ${QDRANT_API_KEY:?inject through the secret manager}
      RICK_OBJECT_STORE_ENDPOINT: ${RICK_OBJECT_STORE_ENDPOINT:?inject the private object-store endpoint}
      RICK_OBJECT_STORE_BUCKET: ${RICK_OBJECT_STORE_BUCKET:?inject the object-store bucket}
      RICK_OBJECT_STORE_REGION: ${RICK_OBJECT_STORE_REGION:?inject the object-store region}
      RICK_OBJECT_STORE_ACCESS_KEY_ID: ${OBJECT_STORE_ACCESS_KEY_ID:?inject through the secret manager}
      RICK_OBJECT_STORE_SECRET_ACCESS_KEY: ${OBJECT_STORE_SECRET_ACCESS_KEY:?inject through the secret manager}
      RICK_LOCKER_BASE_URL: ${RICK_LOCKER_BASE_URL:?inject the reviewed lease boundary}
      LLM_PROVIDER: ${LLM_PROVIDER:?inject the reviewed provider kind}
      LLM_API_KEY: ${LLM_API_KEY:?inject through the secret manager}
      LLM_BASE_URL: ${LLM_BASE_URL:?inject the reviewed provider endpoint}
      LLM_MODEL: ${LLM_MODEL:?inject the reviewed chat model}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:?inject the reviewed embedding model}
      OTEL_SERVICE_NAME: rick-api
      OTEL_EXPORTER_OTLP_ENDPOINT: ${RICK_OTEL_ENDPOINT:?inject the collector endpoint}
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: none
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?inject the exact staging web origin}
      SESSION_COOKIE_SECURE: "true"
      SESSION_COOKIE_SAMESITE: strict
      RICK_WORKER_SCOPE_TENANT: ${RICK_WORKER_SCOPE_TENANT:?inject the worker tenant scope}
      RICK_WORKER_SCOPE_WORKSPACE: ${RICK_WORKER_SCOPE_WORKSPACE:?inject the worker workspace scope}
      RICK_WORKER_SCOPE_COLLECTION: ${RICK_WORKER_SCOPE_COLLECTION:?inject the worker collection scope}
      RICK_COMPOSITION_CREATED_BY: ${RICK_COMPOSITION_CREATED_BY:?inject the composition actor}
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      qdrant: {condition: service_healthy}
      qdrant-init: {condition: service_completed_successfully}
      object-store: {condition: service_healthy}
      object-store-init: {condition: service_completed_successfully}
      otel-collector: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=4).read()\""]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [private, edge]

  worker:
    <<: *service-hardening
    image: ${RICK_WORKER_IMAGE:?inject the exact immutable worker image digest}
    deploy: *service-resources
    environment:
      RICK_ENV: production
      RICK_EXTERNAL_DATABASE_DSN: ${RICK_EXTERNAL_DATABASE_DSN:?inject through the secret manager}
      RICK_REDIS_URL: ${RICK_REDIS_URL:?inject the managed Redis URL}
      RICK_QDRANT_URL: ${RICK_QDRANT_URL:?inject the managed Qdrant URL}
      RICK_QDRANT_COLLECTION: ${RICK_QDRANT_COLLECTION:?inject the versioned Qdrant collection}
      RICK_QDRANT_API_KEY: ${QDRANT_API_KEY:?inject through the secret manager}
      RICK_OBJECT_STORE_ENDPOINT: ${RICK_OBJECT_STORE_ENDPOINT:?inject the private object-store endpoint}
      RICK_OBJECT_STORE_BUCKET: ${RICK_OBJECT_STORE_BUCKET:?inject the object-store bucket}
      RICK_OBJECT_STORE_REGION: ${RICK_OBJECT_STORE_REGION:?inject the object-store region}
      RICK_OBJECT_STORE_ACCESS_KEY_ID: ${OBJECT_STORE_ACCESS_KEY_ID:?inject through the secret manager}
      RICK_OBJECT_STORE_SECRET_ACCESS_KEY: ${OBJECT_STORE_SECRET_ACCESS_KEY:?inject through the secret manager}
      RICK_WORKER_COMPOSITION: ${RICK_WORKER_COMPOSITION:?inject the reviewed worker module:factory composition}
      RICK_WORKER_ID: ${RICK_WORKER_ID:?inject a unique worker identity}
      RICK_WORKER_SCOPE_TENANT: ${RICK_WORKER_SCOPE_TENANT:?inject the worker tenant scope}
      RICK_WORKER_SCOPE_WORKSPACE: ${RICK_WORKER_SCOPE_WORKSPACE:?inject the worker workspace scope}
      RICK_WORKER_SCOPE_COLLECTION: ${RICK_WORKER_SCOPE_COLLECTION:?inject the worker collection scope}
      RICK_COMPOSITION_CREATED_BY: ${RICK_COMPOSITION_CREATED_BY:?inject the composition actor}
      LLM_PROVIDER: ${LLM_PROVIDER:?inject the reviewed provider kind}
      LLM_API_KEY: ${LLM_API_KEY:?inject through the secret manager}
      LLM_BASE_URL: ${LLM_BASE_URL:?inject the reviewed provider endpoint}
      LLM_MODEL: ${LLM_MODEL:?inject the reviewed chat model}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:?inject the reviewed embedding model}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1536}
      OTEL_SERVICE_NAME: rick-worker
      OTEL_EXPORTER_OTLP_ENDPOINT: ${RICK_OTEL_ENDPOINT:?inject the collector endpoint}
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: none
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      qdrant: {condition: service_healthy}
      qdrant-init: {condition: service_completed_successfully}
      object-store: {condition: service_healthy}
      object-store-init: {condition: service_completed_successfully}
      otel-collector: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "/opt/rick/docker/worker-entrypoint.py", "--health-check"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [private]

  worker-b:
    <<: *service-hardening
    image: ${RICK_WORKER_IMAGE:?inject the exact immutable worker image digest}
    deploy: *service-resources
    environment:
      RICK_ENV: production
      RICK_EXTERNAL_DATABASE_DSN: ${RICK_EXTERNAL_DATABASE_DSN:?inject through the secret manager}
      RICK_REDIS_URL: ${RICK_REDIS_URL:?inject the managed Redis URL}
      RICK_QDRANT_URL: ${RICK_QDRANT_URL:?inject the managed Qdrant URL}
      RICK_QDRANT_COLLECTION: ${RICK_QDRANT_COLLECTION:?inject the versioned Qdrant collection}
      RICK_QDRANT_API_KEY: ${QDRANT_API_KEY:?inject through the secret manager}
      RICK_OBJECT_STORE_ENDPOINT: ${RICK_OBJECT_STORE_ENDPOINT:?inject the private object-store endpoint}
      RICK_OBJECT_STORE_BUCKET: ${RICK_OBJECT_STORE_BUCKET:?inject the object-store bucket}
      RICK_OBJECT_STORE_REGION: ${RICK_OBJECT_STORE_REGION:?inject the object-store region}
      RICK_OBJECT_STORE_ACCESS_KEY_ID: ${OBJECT_STORE_ACCESS_KEY_ID:?inject through the secret manager}
      RICK_OBJECT_STORE_SECRET_ACCESS_KEY: ${OBJECT_STORE_SECRET_ACCESS_KEY:?inject through the secret manager}
      RICK_WORKER_COMPOSITION: ${RICK_WORKER_COMPOSITION:?inject the reviewed worker module:factory composition}
      RICK_WORKER_ID: ${RICK_WORKER_ID_B:?inject a unique second worker identity}
      RICK_WORKER_SCOPE_TENANT: ${RICK_WORKER_SCOPE_TENANT:?inject the worker tenant scope}
      RICK_WORKER_SCOPE_WORKSPACE: ${RICK_WORKER_SCOPE_WORKSPACE:?inject the worker workspace scope}
      RICK_WORKER_SCOPE_COLLECTION: ${RICK_WORKER_SCOPE_COLLECTION:?inject the worker collection scope}
      RICK_COMPOSITION_CREATED_BY: ${RICK_COMPOSITION_CREATED_BY:?inject the composition actor}
      LLM_PROVIDER: ${LLM_PROVIDER:?inject the reviewed provider kind}
      LLM_API_KEY: ${LLM_API_KEY:?inject through the secret manager}
      LLM_BASE_URL: ${LLM_BASE_URL:?inject the reviewed provider endpoint}
      LLM_MODEL: ${LLM_MODEL:?inject the reviewed chat model}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:?inject the reviewed embedding model}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1536}
      OTEL_SERVICE_NAME: rick-worker-b
      OTEL_EXPORTER_OTLP_ENDPOINT: ${RICK_OTEL_ENDPOINT:?inject the collector endpoint}
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: none
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      qdrant: {condition: service_healthy}
      qdrant-init: {condition: service_completed_successfully}
      object-store: {condition: service_healthy}
      object-store-init: {condition: service_completed_successfully}
      otel-collector: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "/opt/rick/docker/worker-entrypoint.py", "--health-check"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [private]

  web:
    <<: *service-hardening
    image: ${RICK_WEB_IMAGE:?inject the exact immutable web image digest}
    deploy: *service-resources
    environment:
      RICK_API_INTERNAL_URL: http://api:8000
      NODE_ENV: production
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3000/login >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [edge, private]

volumes:
  postgres-data: {}
  redis-data: {}
  qdrant-data: {}
  object-data: {}
  metrics-data: {}

networks:
  private:
    internal: true
  edge: {}
