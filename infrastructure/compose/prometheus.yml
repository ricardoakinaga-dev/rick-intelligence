global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml
  - /etc/prometheus/prometheus.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:8889]
  - job_name: otel-collector-self
    static_configs:
      - targets: [otel-collector:8888]
  - job_name: rick-api
    metrics_path: /metrics
    # Docker DNS returns each replica's address, preserving distinct instance
    # labels instead of sampling a single load-balanced service address.
    dns_sd_configs:
      - names: [api]
        type: A
        port: 8000
        refresh_interval: 15s
