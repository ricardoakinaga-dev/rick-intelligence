groups:
  - name: rick-runtime
    rules:
      - alert: RickApiReadinessMissing
        expr: rick_api_readiness_status{service="api",status=~"unknown|degraded|not_ready"} == 1
        for: 5m
        labels: {severity: critical}
        annotations: {summary: "RICK API readiness is not healthy"}
      - alert: RickWorkerDeadLetterGrowth
        expr: increase(rick_api_worker_jobs_total{status="dead"}[15m]) > 0
        for: 1m
        labels: {severity: high}
        annotations: {summary: "RICK worker dead-letter jobs increased"}
      - alert: RickApiErrorBudgetBurn
        expr: sum(rate(rick_api_http_errors_total[5m])) / clamp_min(sum(rate(rick_api_http_requests_total[5m])), 1) > 0.05
        for: 10m
        labels: {severity: high}
        annotations: {summary: "RICK API error rate exceeded the warning budget"}
      - alert: RickRetrievalLatencyP95
        expr: histogram_quantile(0.95, sum by (le) (rate(rick_api_retrieval_latency_ms_bucket[10m]))) > 1500
        for: 10m
        labels: {severity: high}
        annotations: {summary: "RICK retrieval p95 exceeded the warning budget"}
      - alert: RickProviderFailureGrowth
        expr: increase(rick_api_provider_failures_total[15m]) > 0
        for: 5m
        labels: {severity: high}
        annotations: {summary: "RICK provider failures increased"}
