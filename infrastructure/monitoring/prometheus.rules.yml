groups:
  - name: rick-runtime
    rules:
      - alert: RickApiReadinessMissing
        expr: max_over_time(rick_readiness_status{service="api"}[5m]) < 1
        for: 5m
        labels: {severity: critical}
        annotations: {summary: "RICK API readiness is not healthy"}
      - alert: RickWorkerDeadLetterGrowth
        expr: increase(rick_worker_jobs_total{status="dead"}[15m]) > 0
        for: 1m
        labels: {severity: high}
        annotations: {summary: "RICK worker dead-letter jobs increased"}
      - alert: RickApiErrorBudgetBurn
        expr: rate(rick_http_requests_total{outcome="error"}[5m]) / clamp_min(rate(rick_http_requests_total[5m]), 1) > 0.05
        for: 10m
        labels: {severity: high}
        annotations: {summary: "RICK API error rate exceeded the warning budget"}
      - alert: RickRetrievalLatencyP95
        expr: histogram_quantile(0.95, sum by (le) (rate(rick_retrieval_latency_ms_bucket[10m]))) > 1500
        for: 10m
        labels: {severity: high}
        annotations: {summary: "RICK retrieval p95 exceeded the warning budget"}
