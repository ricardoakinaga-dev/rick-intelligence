services:
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:v1.15.4
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  redis-locker:
    build:
      context: ../../modulo_redis_locker
      dockerfile: Dockerfile
    container_name: redis-locker
    restart: unless-stopped
    environment:
      PORT: 3000
      REDIS_URL: ${REDIS_URL}
    depends_on:
      - redis
    ports:
      - "3001:3000"

  rick-professor:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: rick-professor
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: info
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      PUBLIC_MODEL_NAME: ${PUBLIC_MODEL_NAME}
      QDRANT_URL: ${QDRANT_URL}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION}
      QDRANT_SCORE_THRESHOLD: ${QDRANT_SCORE_THRESHOLD}
      REDIS_URL: ${REDIS_URL}
      REDIS_LOCKER_URL: ${REDIS_LOCKER_URL}
      MODEL_PREPROCESSOR: ${MODEL_PREPROCESSOR}
      MODEL_PLANNER: ${MODEL_PLANNER}
      MODEL_AGENT: ${MODEL_AGENT}
      MODEL_FALLBACK: ${MODEL_FALLBACK}
    depends_on:
      - redis
      - redis-locker
      - qdrant
    ports:
      - "3020:3000"

  rag-indexer:
    build:
      context: ../../modulo_rag_indexer
      dockerfile: Dockerfile
    container_name: rag-indexer
    restart: unless-stopped
    environment:
      MODE: server
      PORT: 3000
      LOG_LEVEL: info
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      INDEXER_SECRET: ${INDEXER_SECRET}
      INDEXER_INBOX_DIR: ${INDEXER_INBOX_DIR}
      CHECKPOINT_DIR: ${CHECKPOINT_DIR}
      TMP_DIR: ${TMP_DIR}
      QDRANT_URL: ${QDRANT_URL}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION_INDEXER}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
    depends_on:
      - qdrant
    ports:
      - "3030:3000"
    volumes:
      - ./data/books:${INDEXER_INBOX_DIR}
      - ./data/checkpoints:${CHECKPOINT_DIR}
      - ./data/tmp:${TMP_DIR}

volumes:
  qdrant_data:
