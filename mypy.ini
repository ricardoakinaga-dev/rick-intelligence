# Type checking gradual (AUD07-17) — configuração canônica do mypy.
#
# A cobertura é EXPLÍCITA: `files` lista os pacotes já cobertos e a lista de
# erros aceitos vive em docs/baselines/mypy-baseline.txt (ambas versionadas).
# Ampliar a cobertura é alterar os dois arquivos; excluir um pacote é removê-los.
[mypy]
python_version = 3.12
files = packages/contracts/src, packages/authorization/src
mypy_path = packages/contracts/src:packages/authorization/src
show_error_codes = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_unused_configs = True
