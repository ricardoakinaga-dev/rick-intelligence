# Type checking gradual (AUD07-17) — configuração canônica do mypy.
#
# A cobertura é EXPLÍCITA: `files` lista os pacotes já cobertos e a lista de
# erros aceitos vive em docs/baselines/mypy-baseline.txt (ambas versionadas).
# Ampliar a cobertura é alterar os dois arquivos; excluir um pacote é removê-los.
[mypy]
python_version = 3.12
files = packages/contracts/src, packages/authorization/src, apps/api/src/routes/auth.py, apps/api/src/core/rate_limit.py, apps/api/src/dependencies/identity.py, apps/api/src/services/identity_offload.py, apps/api/src/services/audit.py, apps/api/src/services/audit_event.py, apps/api/src/services/audit_operations_store.py, apps/api/src/services/postgres_audit.py, packages/identity/src/rick_identity/snapshots.py, packages/identity/src/rick_identity/postgres.py, packages/identity/src/rick_identity/oidc.py, apps/api/src/core/otel.py, apps/api/src/core/security.py, apps/api/src/core/csrf.py, apps/api/src/core/request_context.py, apps/api/src/core/errors.py, apps/api/src/models.py
mypy_path = packages/contracts/src:packages/authorization/src:packages/identity/src:packages/observability/src:apps/api/src
# Explicit roots remain checked, including both original packages. Imports
# outside this denominator contribute interfaces, not a whole-product claim.
explicit_package_bases = True
follow_imports = silent
check_untyped_defs = True
show_error_codes = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_unused_configs = True

[mypy-services.identity_offload,routes.auth,services.audit,services.audit_event,services.audit_operations_store,services.postgres_audit,rick_identity.snapshots,rick_identity.postgres,rick_identity.oidc,core.otel,core.security,core.csrf,core.request_context,core.errors,models]
disallow_untyped_defs = True
