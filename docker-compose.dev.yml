# Canonical production-shaped development stack.
#
# Every application image, credential, composition factory and external
# connection is explicit. Copy infrastructure/compose/.env.dev.example to an
# ignored .env file, replace every placeholder, and render this file before
# starting it. The stack is intentionally fail-closed when a value is absent.
x-service-hardening: &service-hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  init: true
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m

# Stateful images retain write access only to their declared data volumes, but
# still run without privilege escalation or ambient Linux capabilities.
x-stateful-hardening: &stateful-hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  init: true

# Every service gets a finite local-lab budget.  These are Compose resource
# limits, not a performance claim; the runtime packet must still observe the
# actual host/container behavior before promotion.
x-service-resources: &service-resources
  resources:
    limits:
      cpus: "1.00"
      memory: 1G

services:
  postgres:
    <<: *stateful-hardening
    image: postgres:16.4-alpine
    deploy: *service-resources
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set a disposable development database name}
      POSTGRES_USER: ${POSTGRES_USER:?set a disposable development database user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?inject a disposable development password}
    ports:
      - 127.0.0.1:15432:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [private]

  migrate:
    <<: *service-hardening
    image: ${RICK_API_IMAGE:?supply an immutable API image reference}
    deploy: *service-resources
    environment:
      RICK_EXTERNAL_DATABASE_DSN: ${RICK_EXTERNAL_DATABASE_DSN:?inject the development database DSN}
    command: ["python", "/opt/rick/infrastructure/scripts/migrate.py", "/opt/rick/infrastructure/migrations", "--apply"]
    depends_on:
      postgres: {condition: service_healthy}
    networks: [private]

  redis:
    <<: *stateful-hardening
    image: redis:7.4-alpine
    deploy: *service-resources
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?inject a disposable development password}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    ports:
      - 127.0.0.1:16379:6379
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [private]

  qdrant:
    <<: *stateful-hardening
    image: qdrant/qdrant:v1.12.5
    deploy: *service-resources
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?inject a disposable development API key}
    ports:
      - 127.0.0.1:16333:6333
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test:
        - CMD-SHELL
        - 'wget --header="api-key: $$QDRANT__SERVICE__API_KEY" -q -O- http://127.0.0.1:6333/healthz >/dev/null'
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [private]

  qdrant-init:
    <<: *service-hardening
    image: ${RICK_API_IMAGE:?supply an immutable API image reference}
    deploy: *service-resources
    environment:
      RICK_QDRANT_URL: http://qdrant:6333
      RICK_QDRANT_API_KEY: ${QDRANT_API_KEY:?inject the Qdrant API key}
      RICK_QDRANT_COLLECTION: ${RICK_QDRANT_COLLECTION:?set the Qdrant collection}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1536}
    command: ["python", "/opt/rick/infrastructure/compose/bootstrap_qdrant.py"]
    depends_on:
      qdrant: {condition: service_healthy}
    networks: [private]

  object-store:
    <<: *stateful-hardening
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    deploy: *service-resources
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?inject a disposable development access key}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?inject a disposable development secret}
    ports:
      - 127.0.0.1:19000:9000
      - 127.0.0.1:19001:9001
    volumes:
      - object-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - mc alias set local http://127.0.0.1:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1 && mc ready local
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [private]

  object-store-init:
    <<: *service-hardening
    image: minio/mc:RELEASE.2025-02-28T09-55-16Z
    deploy: *service-resources
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?inject a disposable development access key}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?inject a disposable development secret}
      RICK_OBJECT_STORE_BUCKET: ${RICK_OBJECT_STORE_BUCKET:?set the object-store bucket}
      OBJECT_STORE_ACCESS_KEY_ID: ${OBJECT_STORE_ACCESS_KEY_ID:?set the scoped object-store access key}
      OBJECT_STORE_SECRET_ACCESS_KEY: ${OBJECT_STORE_SECRET_ACCESS_KEY:?set the scoped object-store secret}
    volumes:
      - ./infrastructure/compose/bootstrap_object_store.sh:/opt/bootstrap/bootstrap_object_store.sh:ro
    entrypoint: ["/bin/sh", "/opt/bootstrap/bootstrap_object_store.sh"]
    depends_on:
      object-store: {condition: service_healthy}
    networks: [private]

  jaeger:
    <<: *service-hardening
    image: jaegertracing/all-in-one:1.68.0
    deploy: *service-resources
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      SPAN_STORAGE_TYPE: memory
    ports:
      - 127.0.0.1:16686:16686
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:14269/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [private]

  otel-collector:
    <<: *service-hardening
    image: otel/opentelemetry-collector-contrib:0.123.0
    deploy: *service-resources
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./infrastructure/compose/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - 127.0.0.1:14317:4317
      - 127.0.0.1:14318:4318
      - 127.0.0.1:18889:8889
    depends_on:
      jaeger: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:13133/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [private]

  metrics:
    <<: *service-hardening
    image: prom/prometheus:v2.55.1
    deploy: *service-resources
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --rule.file=/etc/prometheus/alerts.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      - ./infrastructure/compose/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/compose/alerts.yml:/etc/prometheus/alerts.yml:ro
      - metrics-data:/prometheus
    ports:
      - 127.0.0.1:19090:9090
    depends_on:
      otel-collector: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:9090/-/ready >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [private]

  api:
    <<: *service-hardening
    image: ${RICK_API_IMAGE:?supply an immutable API image reference}
    deploy: *service-resources
    environment:
      # The disposable lab uses the external graph in dev mode. Production
      # admission remains a separate HTTPS/TLS and authority gate.
      RICK_ENV: dev
      RICK_IDENTITY_MODE: dev
      RICK_API_CHAT_BACKEND: professor
      RICK_API_COMPOSITION: ${RICK_API_COMPOSITION:?supply the reviewed module:factory composition}
      RICK_EXTERNAL_DATABASE_DSN: ${RICK_EXTERNAL_DATABASE_DSN:?inject the development database DSN}
      RICK_REDIS_URL: ${RICK_REDIS_URL:?inject the development Redis URL}
      RICK_QDRANT_URL: http://qdrant:6333
      RICK_QDRANT_COLLECTION: ${RICK_QDRANT_COLLECTION:?set the Qdrant collection}
      RICK_QDRANT_API_KEY: ${QDRANT_API_KEY:?inject the Qdrant API key}
      RICK_OBJECT_STORE_ENDPOINT: http://object-store:9000
      RICK_OBJECT_STORE_BUCKET: ${RICK_OBJECT_STORE_BUCKET:?set the object-store bucket}
      RICK_OBJECT_STORE_REGION: ${RICK_OBJECT_STORE_REGION:?set the object-store region}
      RICK_OBJECT_STORE_ACCESS_KEY_ID: ${OBJECT_STORE_ACCESS_KEY_ID:?set the scoped object-store access key}
      RICK_OBJECT_STORE_SECRET_ACCESS_KEY: ${OBJECT_STORE_SECRET_ACCESS_KEY:?set the scoped object-store secret}
      RICK_LOCKER_BASE_URL: ${RICK_LOCKER_BASE_URL:?supply the reviewed lease boundary}
      LLM_PROVIDER: ${LLM_PROVIDER:?set the reviewed provider kind}
      LLM_API_KEY: ${LLM_API_KEY:?inject a development provider key}
      LLM_BASE_URL: ${LLM_BASE_URL:?set the reviewed provider endpoint}
      LLM_MODEL: ${LLM_MODEL:?set the reviewed chat model}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:?set the reviewed embedding model}
      OTEL_SERVICE_NAME: rick-api
      OTEL_EXPORTER_OTLP_ENDPOINT: ${RICK_OTEL_ENDPOINT:?set the collector endpoint}
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: none
      CORS_ALLOWED_ORIGINS: http://localhost:13000
      SESSION_COOKIE_SECURE: "true"
      SESSION_COOKIE_SAMESITE: strict
      RICK_WORKER_SCOPE_TENANT: ${RICK_WORKER_SCOPE_TENANT:?set the disposable worker tenant scope}
      RICK_WORKER_SCOPE_WORKSPACE: ${RICK_WORKER_SCOPE_WORKSPACE:?set the disposable worker workspace scope}
      RICK_WORKER_SCOPE_COLLECTION: ${RICK_WORKER_SCOPE_COLLECTION:?set the disposable worker collection scope}
      RICK_COMPOSITION_CREATED_BY: ${RICK_COMPOSITION_CREATED_BY:?set the disposable composition actor}
    ports:
      - 127.0.0.1:18000:8000
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      qdrant: {condition: service_healthy}
      qdrant-init: {condition: service_completed_successfully}
      object-store: {condition: service_healthy}
      object-store-init: {condition: service_completed_successfully}
      otel-collector: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=4).read()\""]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [private, edge]

  worker:
    <<: *service-hardening
    image: ${RICK_WORKER_IMAGE:?supply an immutable worker image reference}
    deploy: *service-resources
    environment:
      RICK_ENV: dev
      RICK_EXTERNAL_DATABASE_DSN: ${RICK_EXTERNAL_DATABASE_DSN:?inject the development database DSN}
      RICK_REDIS_URL: ${RICK_REDIS_URL:?inject the development Redis URL}
      RICK_QDRANT_URL: http://qdrant:6333
      RICK_QDRANT_COLLECTION: ${RICK_QDRANT_COLLECTION:?set the Qdrant collection}
      RICK_QDRANT_API_KEY: ${QDRANT_API_KEY:?inject the Qdrant API key}
      RICK_OBJECT_STORE_ENDPOINT: http://object-store:9000
      RICK_OBJECT_STORE_BUCKET: ${RICK_OBJECT_STORE_BUCKET:?set the object-store bucket}
      RICK_OBJECT_STORE_REGION: ${RICK_OBJECT_STORE_REGION:?set the object-store region}
      RICK_OBJECT_STORE_ACCESS_KEY_ID: ${OBJECT_STORE_ACCESS_KEY_ID:?set the scoped object-store access key}
      RICK_OBJECT_STORE_SECRET_ACCESS_KEY: ${OBJECT_STORE_SECRET_ACCESS_KEY:?set the scoped object-store secret}
      RICK_WORKER_COMPOSITION: ${RICK_WORKER_COMPOSITION:?supply the reviewed worker module:factory composition}
      RICK_WORKER_ID: ${RICK_WORKER_ID:?set a unique worker identity}
      RICK_WORKER_SCOPE_TENANT: ${RICK_WORKER_SCOPE_TENANT:?set the disposable worker tenant scope}
      RICK_WORKER_SCOPE_WORKSPACE: ${RICK_WORKER_SCOPE_WORKSPACE:?set the disposable worker workspace scope}
      RICK_WORKER_SCOPE_COLLECTION: ${RICK_WORKER_SCOPE_COLLECTION:?set the disposable worker collection scope}
      RICK_COMPOSITION_CREATED_BY: ${RICK_COMPOSITION_CREATED_BY:?set the disposable composition actor}
      LLM_PROVIDER: ${LLM_PROVIDER:?set the reviewed provider kind}
      LLM_API_KEY: ${LLM_API_KEY:?inject a development provider key}
      LLM_BASE_URL: ${LLM_BASE_URL:?set the reviewed provider endpoint}
      LLM_MODEL: ${LLM_MODEL:?set the reviewed chat model}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:?set the reviewed embedding model}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1536}
      OTEL_SERVICE_NAME: rick-worker
      OTEL_EXPORTER_OTLP_ENDPOINT: ${RICK_OTEL_ENDPOINT:?set the collector endpoint}
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: none
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      qdrant: {condition: service_healthy}
      qdrant-init: {condition: service_completed_successfully}
      object-store: {condition: service_healthy}
      object-store-init: {condition: service_completed_successfully}
      otel-collector: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "/opt/rick/docker/worker-entrypoint.py", "--health-check"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [private]

  worker-b:
    <<: *service-hardening
    image: ${RICK_WORKER_IMAGE:?supply an immutable worker image reference}
    deploy: *service-resources
    environment:
      RICK_ENV: dev
      RICK_EXTERNAL_DATABASE_DSN: ${RICK_EXTERNAL_DATABASE_DSN:?inject the development database DSN}
      RICK_REDIS_URL: ${RICK_REDIS_URL:?inject the development Redis URL}
      RICK_QDRANT_URL: http://qdrant:6333
      RICK_QDRANT_COLLECTION: ${RICK_QDRANT_COLLECTION:?set the Qdrant collection}
      RICK_QDRANT_API_KEY: ${QDRANT_API_KEY:?inject the Qdrant API key}
      RICK_OBJECT_STORE_ENDPOINT: http://object-store:9000
      RICK_OBJECT_STORE_BUCKET: ${RICK_OBJECT_STORE_BUCKET:?set the object-store bucket}
      RICK_OBJECT_STORE_REGION: ${RICK_OBJECT_STORE_REGION:?set the object-store region}
      RICK_OBJECT_STORE_ACCESS_KEY_ID: ${OBJECT_STORE_ACCESS_KEY_ID:?set the scoped object-store access key}
      RICK_OBJECT_STORE_SECRET_ACCESS_KEY: ${OBJECT_STORE_SECRET_ACCESS_KEY:?set the scoped object-store secret}
      RICK_WORKER_COMPOSITION: ${RICK_WORKER_COMPOSITION:?supply the reviewed worker module:factory composition}
      RICK_WORKER_ID: ${RICK_WORKER_ID_B:?set a unique second worker identity}
      RICK_WORKER_SCOPE_TENANT: ${RICK_WORKER_SCOPE_TENANT:?set the disposable worker tenant scope}
      RICK_WORKER_SCOPE_WORKSPACE: ${RICK_WORKER_SCOPE_WORKSPACE:?set the disposable worker workspace scope}
      RICK_WORKER_SCOPE_COLLECTION: ${RICK_WORKER_SCOPE_COLLECTION:?set the disposable worker collection scope}
      RICK_COMPOSITION_CREATED_BY: ${RICK_COMPOSITION_CREATED_BY:?set the disposable composition actor}
      LLM_PROVIDER: ${LLM_PROVIDER:?set the reviewed provider kind}
      LLM_API_KEY: ${LLM_API_KEY:?inject a development provider key}
      LLM_BASE_URL: ${LLM_BASE_URL:?set the reviewed provider endpoint}
      LLM_MODEL: ${LLM_MODEL:?set the reviewed chat model}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:?set the reviewed embedding model}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1536}
      OTEL_SERVICE_NAME: rick-worker-b
      OTEL_EXPORTER_OTLP_ENDPOINT: ${RICK_OTEL_ENDPOINT:?set the collector endpoint}
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: none
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      qdrant: {condition: service_healthy}
      qdrant-init: {condition: service_completed_successfully}
      object-store: {condition: service_healthy}
      object-store-init: {condition: service_completed_successfully}
      otel-collector: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "/opt/rick/docker/worker-entrypoint.py", "--health-check"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [private]

  web:
    <<: *service-hardening
    image: ${RICK_WEB_IMAGE:?supply an immutable web image reference}
    deploy: *service-resources
    environment:
      RICK_API_INTERNAL_URL: http://api:8000
      NODE_ENV: production
    ports:
      - 127.0.0.1:13000:3000
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3000/login >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [edge, private]

volumes:
  postgres-data: {}
  redis-data: {}
  qdrant-data: {}
  object-data: {}
  metrics-data: {}

networks:
  private:
    internal: true
  edge: {}
